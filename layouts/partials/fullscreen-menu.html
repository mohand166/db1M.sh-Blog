{{ $endpoints := hugo.Data.fullscreen_menu.items }}
<div id="fullscreen-navigation" class="term-dropdown" role="dialog" aria-modal="false" aria-label="Terminal navigation" aria-hidden="true">
  <div class="term-dropdown__panel">
    <div class="term-dropdown__input-row" style="position:relative;">
      <span class="term-dropdown__prompt" aria-hidden="true">$</span>
      <input
        type="text"
        class="term-dropdown__input"
        data-term-input
        placeholder="type a command... (cd, /, ?)"
        autocomplete="off"
        spellcheck="false"
        aria-label="Enter navigation command"
        aria-autocomplete="list"
        aria-controls="term-autocomplete"
      >
      <span class="term-dropdown__cursor" aria-hidden="true">_</span>
      <div id="term-autocomplete" class="term-autocomplete" data-term-autocomplete hidden></div>
    </div>
    <div class="term-dropdown__feedback" data-term-feedback aria-live="polite"></div>

    <p class="term-dropdown__label">AVAILABLE ENDPOINTS</p>
    <nav class="term-dropdown__endpoints" aria-label="Site navigation">
      {{ range $endpoints }}
        {{ if ne (default "" .action) "search" }}
          <button type="button" class="term-dropdown__endpoint" data-term-endpoint="{{ .url | urlize }}">
            {{ .label }}
          </button>
        {{ end }}
      {{ end }}
    </nav>

    <div class="term-dropdown__status">
      <span aria-hidden="true"></span>
      <time data-utc-status>UTC // SYSTEM ONLINE</time>
    </div>
  </div>
</div>
