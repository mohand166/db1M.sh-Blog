<details
  open
  id="TOCView"
  class="toc-right mt-0 overflow-y-auto overscroll-contain bf-scrollbar rounded-lg -ms-5 ps-5 pe-2 hidden lg:block">
  <summary
    class="block py-1 text-lg font-semibold cursor-pointer bg-neutral-100 text-neutral-800 -ms-5 ps-5 dark:bg-neutral-700 dark:text-neutral-100 lg:hidden">
    {{ i18n "article.table_of_contents" }}
  </summary>
  <div
    class="min-w-[220px] py-2 border-dotted border-s-1 -ms-5 ps-5 dark:border-neutral-600">
    {{ .TableOfContents | emojify }}
  </div>
</details>
<details class="toc-inside mt-0 overflow-hidden rounded-lg -ms-5 ps-5 lg:hidden">
  <summary
    class="py-1 text-lg font-semibold cursor-pointer bg-neutral-100 text-neutral-800 -ms-5 ps-5 dark:bg-neutral-700 dark:text-neutral-100 lg:hidden">
    {{ i18n "article.table_of_contents" }}
  </summary>
  <div
    class="py-2 border-dotted border-neutral-300 border-s-1 -ms-5 ps-5 dark:border-neutral-600">
    {{ .TableOfContents | emojify }}
  </div>
</details>

{{ if .Site.Params.smartTOC }}
<script>
  (function () {
    'use strict'

    const SCROLL_OFFSET_RATIO = 0.33
    const TOC_SELECTOR = '.toc #TableOfContents, .toc-inside #TableOfContents'
    const TOC_LINK_SELECTOR = 'a[href^="#"]'
    const ACTIVE_CLASS = 'active'

    function getHeadingById(id) {
      if (!id) return null
      return document.getElementById(id)
    }

    function getActiveAnchorId(anchors, tocIds, offsetRatio) {
      const threshold = window.scrollY + window.innerHeight * offsetRatio

      for (let i = anchors.length - 1; i >= 0; i--) {
        const top = anchors[i].getBoundingClientRect().top + window.scrollY
        if (top <= threshold && tocIds.has(anchors[i].id)) {
          return anchors[i].id
        }
      }

      return anchors.find(anchor => tocIds.has(anchor.id))?.id || ''
    }

    function openBranch(link, toc) {
      let item = link.closest('li')
      item?.querySelectorAll('ul').forEach(ul => ul.style.display = '')

      while (item && toc.contains(item)) {
        const childList = item.querySelector(':scope > ul')
        if (childList) childList.style.display = ''

        const parentList = item.parentElement
        if (parentList && parentList.matches('ul')) parentList.style.display = ''
        item = parentList?.closest('li')
      }
    }

    function collapseInactiveBranches(toc) {
      toc.querySelectorAll('li').forEach(item => {
        if (!item.querySelector(':scope > a')) return
        const childList = item.querySelector(':scope > ul')
        if (childList) childList.style.display = 'none'
      })
    }

    function updateTOC({ toc, anchors, tocIds, links, scrollOffset, collapseInactive, activeIdOverride }) {
      const activeId = activeIdOverride || getActiveAnchorId(anchors, tocIds, scrollOffset)
      if (!activeId) return

      if (collapseInactive) {
        collapseInactiveBranches(toc)
      }

      links.forEach(link => {
        const isActive = link.getAttribute('href') === `#${activeId}`
        link.classList.toggle(ACTIVE_CLASS, isActive)
      })

      const activeLink = toc.querySelector(`a[href="#${CSS.escape(activeId)}"]`)
      if (activeLink && collapseInactive) openBranch(activeLink, toc)
    }

    function initTOC(toc) {
      const collapseInactive = {{ if site.Params.smartTOCHideUnfocusedChildren }}true{{ else }}false{{ end }}
      const links = [...toc.querySelectorAll(TOC_LINK_SELECTOR)]
      const tocIds = new Set(links.map(link => decodeURIComponent(link.getAttribute('href').substring(1))))
      const anchors = [...tocIds]
        .map(getHeadingById)
        .filter(Boolean)
        .sort((a, b) => a.getBoundingClientRect().top + window.scrollY - (b.getBoundingClientRect().top + window.scrollY))

      if (!links.length || !anchors.length) return

      if (collapseInactive) {
        collapseInactiveBranches(toc)
      }

      const config = {
        toc,
        anchors,
        tocIds,
        links,
        scrollOffset: SCROLL_OFFSET_RATIO,
        collapseInactive
      }

      links.forEach(link => {
        link.addEventListener('click', () => {
          const activeId = decodeURIComponent(link.getAttribute('href').substring(1))
          updateTOC({ ...config, activeIdOverride: activeId })
        })
      })

      window.addEventListener('scroll', () => updateTOC(config), { passive: true })
      window.addEventListener('hashchange', () => updateTOC(config), { passive: true })

      updateTOC(config)
    }

    function initTOCs() {
      document.querySelectorAll(TOC_SELECTOR).forEach(initTOC)
    }

    document.readyState === 'loading'
      ? document.addEventListener('DOMContentLoaded', initTOCs)
      : initTOCs()
  })()
</script>
{{ end }}
